<!-- ==================== PREVIEW (for development) ==================== -->
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anki Card Preview</title>
    <link rel="stylesheet" href="../styles/card.css" />
  </head>
  <body>
    <div class="card">
      <div class="front">
        <div class="word">Bonjour</div>
        <div class="part-of-speech">interjection</div>
      </div>

      <hr id="answer" />

      <div class="back">
        <div class="definition">Hello, good day</div>

        <div class="example">
          <span class="label">Example:</span>
          Bonjour, comment allez-vous ? | (Hello, how are you?)
        </div>

        <div class="notes">
          <span class="label">Notes:</span>
          Used as a greeting during the day; More formal than "Salut"
        </div>
      </div>
    </div>
  </body>
</html>
