<link rel="stylesheet" href="_french-vocab.css">

<div class="card">
  <div class="card-container">
    <div class="french-header">
      <span class="french-word">{{Word}}</span>
      <span class="part-of-speech">{{PartOfSpeech}}</span>
    </div>
    <div class="pronunciation">{{Pronunciation}}</div>
  </div>

  <hr class="divider">

  <div class="back-content">
    <h2>Wiktionary definition</h2>
    {{Wiktionary}}

    <h2>AI definition</h2>
    {{AiDefinitionFr}}

    <h2>AI translation and definition</h2>
    {{AiDefinitionEn}}

    <h2>AI explanation</h2>
    {{AiExplanation}}
  </div>
</div>
